<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | IMPERIAL EDUCATION</title><link rel="stylesheet" href="/style.css"></head><body><header class="bar"><a class="logo" href="/">✦ IMPERIAL <span>EDUCATION</span></a><nav><a href="/">Courses</a><a href="/login">Sign in</a></nav></header><main class="auth-shell"><section class="admin-panel"><div class="eyebrow">JOIN OUR COMMUNITY</div><h1>Create your account</h1><p>Register to get ready for your learning journey.</p><form id="register-form"><label>Full name<input id="full-name" required maxlength="120" autocomplete="name"></label><label>Email address<input id="email" type="email" required maxlength="254" autocomplete="email"></label><label>Password (at least 12 characters)<input id="password" type="password" required minlength="12" maxlength="72" autocomplete="new-password"></label><button type="submit" class="admin-button" id="register-button">Create Account</button><p id="register-message" role="status" aria-live="polite"></p></form><p>Already registered? <a href="/login">Sign in</a></p></section></main><script src="/register.js"></script></body></html>
